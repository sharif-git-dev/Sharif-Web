    <!-- Set the theme before first paint so there is no flash of the wrong one. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("sj-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);

        // Motion: follow the system unless the visitor chose otherwise.
        var motion = null;
        try {
          motion = localStorage.getItem("sj-motion");
        } catch (e) {}
        var reduce =
          motion === "off" ||
          (motion !== "on" &&
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        document.documentElement.setAttribute("data-motion", reduce ? "reduce" : "full");
      })();
    </script>
    <style>
      html {
        background: #0e0f0d;
      }
      html[data-theme="light"] {
        background: #f5f4ef;
      }
    </style>
  </head>
